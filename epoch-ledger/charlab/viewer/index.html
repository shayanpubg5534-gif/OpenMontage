<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<!-- Character lab viewer (M2.1). ?three=<dir with package/> &glb=<url>. Served from the repository root. -->
<script>
const q = new URLSearchParams(location.search);
const base = q.get('three');
document.write(`<script type="importmap">${JSON.stringify({ imports: { three: base + '/package/build/three.module.js', 'three/addons/': base + '/package/examples/jsm/' } })}<\/script>`);
</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
const q = new URLSearchParams(location.search);
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const outline = new OutlineEffect(renderer, { defaultThickness: 0.0035, defaultColor: [0.12, 0.09, 0.07] });
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9dcc2');
const ramp = new THREE.DataTexture(new Uint8Array([105, 105, 105, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: ramp });
scene.add(new THREE.HemisphereLight('#fff4e0', '#7a6050', 1.3));
const sun = new THREE.DirectionalLight('#ffe2b8', 2.4); sun.position.set(2.5, 5, 3.5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), toon('#b98a62')); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const gltf = await new GLTFLoader().loadAsync(q.get('glb'));
const root = gltf.scene; scene.add(root);
let skinned = null, morphs = {}, bones = [];
root.traverse(o => {
  if (o.isSkinnedMesh) { skinned = o; o.castShadow = true;
    o.material = new THREE.MeshToonMaterial({ color: o.material.color, gradientMap: ramp }); }
  if (o.isBone) bones.push(o);
});
if (skinned && skinned.morphTargetDictionary) morphs = skinned.morphTargetDictionary;
const bone = n => bones.find(b => b.name === n);
const mixer = new THREE.AnimationMixer(root);
const clips = Object.fromEntries(gltf.animations.map(a => [a.name, a]));
let action = null;
function use(name) { mixer.stopAllAction(); action = name && clips[name] ? mixer.clipAction(clips[name]) : null;
  if (action) { action.setLoop(THREE.LoopOnce); action.clampWhenFinished = true; action.play(); } }   // seek = pose at t, no wrap-around
// a prop in the right hand: parented to the hand bone, so it inherits the hand's transform every frame
const prop = new THREE.Mesh(new THREE.BoxGeometry(.06, .22, .16), toon('#2d6fb3')); prop.castShadow = true;
const hand = bone('hand_r'); if (hand) { hand.add(prop); prop.position.set(0, .09, .03); }
// camera framings
const cam = new THREE.PerspectiveCamera(30, W / H, .05, 100);
const target = new THREE.Vector3();
function frame(kind) {
  root.updateMatrixWorld(true);
  const head = bone('head'), pelvis = bone('pelvis'), hR = bone('hand_r');
  const p = v => v.getWorldPosition(new THREE.Vector3());
  const hp = p(head), pp = p(pelvis);
  if (kind === 'wide') { target.set(pp.x, .9, pp.z); cam.position.set(pp.x + 1.2, 1.3, pp.z + 5.6); cam.fov = 30; }
  if (kind === 'medium') { target.set(pp.x, 1.25, pp.z); cam.position.set(pp.x + .6, 1.45, pp.z + 2.6); cam.fov = 30; }
  if (kind === 'close') { target.copy(hp).add(new THREE.Vector3(0, .02, 0)); cam.position.copy(hp).add(new THREE.Vector3(.18, .02, .75)); cam.fov = 28; }
  if (kind === 'side') { target.copy(hp); cam.position.copy(hp).add(new THREE.Vector3(.85, .0, .0)); cam.fov = 28; }
  if (kind === 'profile') { target.set(pp.x, .85, pp.z); cam.position.set(pp.x + 5.5, 1.0, pp.z); cam.fov = 30; }
  if (kind === 'hand') { const h = p(hR); target.copy(h); cam.position.copy(h).add(new THREE.Vector3(.12, .1, .5)); cam.fov = 26; }
  cam.updateProjectionMatrix(); cam.lookAt(target);
}
window.info = { bones: bones.length, boneNames: bones.map(b => b.name), morphs: Object.keys(morphs), clips: gltf.animations.map(a => [a.name, +a.duration.toFixed(3), a.tracks.length]),
  revision: THREE.REVISION, renderer: (() => { const g = renderer.getContext(); const d = g.getExtension('WEBGL_debug_renderer_info'); return d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : '?'; })() };
window.renderAt = (clip, t, kind, morph = {}, showProp = true) => {
  prop.visible = showProp;
  if (!action || action.getClip().name !== clip) use(clip);
  mixer.setTime(t);
  for (const k in morphs) skinned.morphTargetInfluences[morphs[k]] = morph[k] || 0;
  frame(kind);
  outline.render(scene, cam);
};
window.measure = (clip, t) => {             // world positions for contact / foot-sliding analysis
  if (!action || action.getClip().name !== clip) use(clip);
  mixer.setTime(t); root.updateMatrixWorld(true);
  const w = o => o ? o.getWorldPosition(new THREE.Vector3()).toArray() : null;
  return { hand: w(hand), prop: w(prop), footL: w(bone('foot_l')), footR: w(bone('foot_r')), ballL: w(bone('ball_l')), ballR: w(bone('ball_r')),
           tip: w(bone('middle_03_r')), pelvis: w(bone('pelvis')), head: w(bone('head')) };
};
window.ready = true;
</script></body></html>
