<!doctype html><html><head><meta charset="utf-8">
<!-- Artistic-direction gate: integration test. Loads a glTF character exported from another character system into the
     M4/M5 runtime stage (editorial look, bank set) to see what survives: ?three=DIR&glb=URL&cam=medium|close&x=&yaw=&scale= -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script>
const q = new URLSearchParams(location.search);
document.write(`<script type="importmap">${JSON.stringify({ imports: { three: q.get('three') + '/package/build/three.module.js', 'three/addons/': q.get('three') + '/package/examples/jsm/' } })}<\/script>`);
</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createStage } from '../motion/stage.js';
import { buildEnvironment } from '../motion/env.js';
const q = new URLSearchParams(location.search);
try {
  const stage = await createStage({ env: 'bank', look: 'editorial' });
  const spec = await (await fetch('/epoch-ledger/charlab/motion/sets/bank_office.json')).json();
  stage.setPropTint((spec.lights || {}).propShadow, (spec.lights || {}).propLight);
  buildEnvironment(stage, spec); stage.setLights(spec.lights || {});
  const g = await new GLTFLoader().loadAsync(q.get('glb'));
  const root = g.scene; const sc = +(q.get('scale') || 1);
  root.scale.setScalar(sc); root.position.set(+(q.get('x') || -0.3), 0, +(q.get('z') || 0.4)); root.rotation.y = (+(q.get('yaw') || 0)) * Math.PI / 180;
  let skinned = 0, morphs = 0, mats = new Set();
  root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; if (o.isSkinnedMesh) skinned++; if (o.morphTargetDictionary) morphs += Object.keys(o.morphTargetDictionary).length; mats.add(o.material && o.material.type); } });
  stage.scene.add(root); root.updateMatrixWorld(true);
  // lower the arms: find the upper-arm deform bones and rotate each about the axis that brings the wrist down most
  const bones = []; root.traverse(o => { if (o.isBone) bones.push(o); });
  const find = re => bones.find(b => re.test(b.name));
  for (const s of ['L', 'R']) {
    const ua = find(new RegExp(`DEF.?UpperArm.?_?1?[._]${s}$|DEF.?UpperArm[._]${s}$`, 'i')) || find(new RegExp(`UpperArm.*[._]${s}$`, 'i'));
    const wr = find(new RegExp(`DEF.?(Wrist|Hand)[._]${s}$`, 'i'));
    if (!ua || !wr) continue;
    const q0 = ua.quaternion.clone(); let best = null;
    for (const ax of [new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,1), new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,-1)]) {
      ua.quaternion.copy(q0).multiply(new THREE.Quaternion().setFromAxisAngle(ax, 1.15)); root.updateMatrixWorld(true);
      const y = wr.getWorldPosition(new THREE.Vector3()).y; if (!best || y < best.y) best = { y, ax };
    }
    ua.quaternion.copy(q0).multiply(new THREE.Quaternion().setFromAxisAngle(best.ax, 1.15));
  }
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root); const H = box.max.y - box.min.y;
  const head = new THREE.Vector3((box.min.x + box.max.x) / 2, box.max.y - H * .1, (box.min.z + box.max.z) / 2);
  const cam = stage.cam; const close = q.get('cam') === 'close';
  if (close) { cam.fov = 24; cam.position.set(head.x + .25, head.y + .02, head.z + 1.25); cam.lookAt(head.x, head.y - .02, head.z); }
  else { cam.fov = 34; cam.position.set(head.x + .6, H * .62, head.z + 3.1); cam.lookAt(head.x, H * .5, head.z); }
  cam.updateProjectionMatrix();
  const t0 = performance.now();
  stage.render({ msaa: 4, shadow: 2048, inkPass: true, haze: .14, dof: close ? 1.4 : 0, focus: close ? 1.25 : 3, focusRange: .3 });
  window.info = { skinned, morphs, materials: [...mats], bones: bones.length, height: +H.toFixed(2), renderMs: Math.round(performance.now() - t0) };
  window.ready = true;
} catch (e) { window.err = String(e && e.stack || e); }
</script></body></html>
